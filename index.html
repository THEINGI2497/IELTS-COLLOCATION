<html>
    <head><meta charset="UTF-8">
        <meta name="viewport"
content="width=device-width, initial-scale=1.0">
  <title>IELTS Vocabulary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <body>

  <div class="pagination-container">
    <button onclick="prevPage()">Previous</button>
    <span id="pageIndicator">Page 1</span>
    <button onclick="nextPage()">Next</button>
  </div>

  <div class="pagination-container">
    <button onclick="prevCollPage()">Previous</button>
    <span id="collPageIndicator">Page 1</span>
    <button onclick="nextCollPage()">Next</button>
  </div>

</body>

  <link rel="stylesheet" href="style.css">
    </head>
    <body>

    <header>
    <h1>Important Vocabulary</h1></header>
    <nav>
        <ol>
            <li>IELTS VOCABULARY</li>
            <li>COLLOCATION</li>
        </ol>
    </nav>
    <main>
        <section>
    <h2>IELTS Vocabulary</h2>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search for a word, meaning, 
        collocation"></div>
    <p id="vocabCount" style="font-weight: bold; color: black;
    margin-top: 5px;"></p>
    <p id="collocationCount" style="font-weight: bold;"></p>
    <button id="clearBtn">Clear</button>
    <table id="vocabTable"></table>
<h3 style="color: #333; margin-top: 20px;">Collocation</h3>
    <table id="collocationTable"></table>
     <button onclick="prevVocabPage()">Previous</button>
      
<tr>
    <th>Word</th>
<th>Meaning</th>
<th>Collocation</th>
<th>Daily Phrase</th>
<th>Daily Meaning</th>
<tr>
</table>  
</table>
<button onclick="startQuizMode()" style="margin: 10px 0; padding: 10px 15px; cursor: pointer;">Quiz / Flashcard Mode စတင်ရန်</button>

<div id="quizContainer" style="display: none; margin-top: 15px; padding: 20px; border: 2px solid #4CAF50; border-radius: 8px; background-color: #f9f9f9; max-width: 400px;">
  <h3>🧠 Flashcard / Quiz Practice</h3>
  <p id="quizWord" style="font-size: 22px; font-weight: bold; margin: 15px 0; color: #333;"></p>
  
  <button onclick="showAnswer()" style="padding: 8px 12px; cursor: pointer;">အဓိပ္ပာယ် ကြည့်ရန်</button>
  <p id="quizMeaning" style="margin-top: 15px; font-size: 18px; color: #d9534f; font-weight: bold;"></p>
  
  <div style="margin-top: 20px;">
    <button onclick="nextQuizQuestion()" style="padding: 8px 12px; cursor: pointer;">နောက်တစ်ပုဒ် ➡️</button>
    <button onclick="closeQuizMode()" style="padding: 8px 12px; cursor: pointer; background-color: #f44336; color: white; border: none;">ပိတ်မည် ✖</button>
  </div>
</div>

     </section>
    <footer> Copyright. For Ielts 2026</footer>
    <script src="script.js"></script>
    
        </main>

</body>
</html>
